
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tulpar Akıllı Bileklik - Yönetim Paneli</title>
<meta name="theme-color" content="#0e3b43">
<style>
:root{--ink:#0e3b43;--ink2:#4b6b70;--bg:#eef3f1;--card:#fff;--line:#d5e0dd;--hr:#d9482b;--ox:#1b6fa8;--tp:#c98512;--ok:#2c8a5b;--bad:#c4311f;--acc:#f2a65a}
*{box-sizing:border-box;margin:0}
body{font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:500px;margin:20px auto}
h2{font-size:18px;margin-bottom:6px}
.sub{color:var(--ink2);font-size:13px;margin-bottom:12px}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600}
.btn-p{background:var(--ink);color:#fff;border-color:var(--ink);width:100%}
input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fbfdfc;margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:center}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
</style>
</head>
<body>

<div class="card">
  <div class="row">
    <h2>Yönetim Paneli</h2>
    <button onclick="alert('Kapatıldı')">Kapat</button>
  </div>
  <p class="sub">Yalnızca Doktor rolü tedavi/ilaç ekleyebilir. Geçmiş kayıtlar hiçbir rolle değiştirilemez.</p>
  
  <div style="margin-top:14px">
    <div class="row">
      <div><b>Dr. Selin Kaya</b><br><small style="color:var(--ink2)">PIN 1234</small></div>
      <select style="width:140px"><option>Doktor</option></select>
    </div>
    <hr>
    <div class="row">
      <div><b>Dr. Murat Aksoy</b><br><small style="color:var(--ink2)">PIN 5678</small></div>
      <select style="width:140px"><option>Doktor</option></select>
    </div>
    <hr>
    <div class="row">
      <div><b>Hemşire Canan</b><br><small style="color:var(--ink2)">PIN 1111</small></div>
      <select style="width:140px"><option>Hemşire</option></select>
    </div>
    <hr>
    <div class="row">
      <div><b>Bakıcı Ahmet</b><br><small style="color:var(--ink2)">PIN 2222</small></div>
      <select style="width:140px"><option>Hasta Bakıcı</option></select>
    </div>
    <hr>
    <div class="row">
      <div><b>Tekniker Elif</b><br><small style="color:var(--ink2)">PIN 3333</small></div>
      <select style="width:140px"><option>Tekniker</option></select>
    </div>
  </div>

  <div style="margin-top:18px">
    <input type="text" placeholder="Yeni personel adı">
    <input type="password" placeholder="4 haneli PIN" maxlength="4">
    <select>
      <option>Doktor</option>
      <option>Hemşire</option>
      <option>Hasta Bakıcı</option>
      <option>Tekniker</option>
    </select>
    <button class="btn-p" style="margin-top:8px" onclick="alert('Personel eklendi')">Personel ekle</button>
  </div>
</div>

</body>
</html>
